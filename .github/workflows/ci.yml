name: CI

# Fast, blocking feedback only. The browser instruments live in probes.yml
# (nightly, tag, manual) and the platform builds in release.yml (tag) — this
# file must stay under ~8 minutes of wall clock or it stops being useful.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: &docs-ignore
      - "**.md"
      - "Assets/**"
      - "LICENSE"
      - "stealth-bench-sites.csv"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore: *docs-ignore

# A newer push to the same PR supersedes the older run. Never cancel
# main/dispatch runs: a release reads the exact commit's result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.86
      - name: Check advertised minimum Rust version
        # rust-toolchain.toml pins 1.100.0 for the workspace; this job must
        # override it explicitly or rustup follows the file and the grep below
        # fails on the pinned version instead of exercising the MSRV.
        env:
          RUSTUP_TOOLCHAIN: "1.86.0"
        run: |
          rustc --version | grep -E '^rustc 1[.]86[.]0 '
          cargo check --locked --all-targets

  # The android cfg gates are source-level support (no Android artifact is
  # published), so the guard is compilation: the runner's NDK provides the
  # bionic sysroot that ring's C needs.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: "aarch64-linux-android"
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64
      - name: Point cc-rs at the NDK toolchain
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* | sort -V | tail -1)}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$(ls "$bin" | grep -E '^aarch64-linux-android[0-9]+-clang$' | sort -V | tail -1)"
          test -n "$cc"
          echo "CC_aarch64-linux-android=$bin/$cc" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=$bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Check the android target
        run: cargo check --locked --target aarch64-linux-android
