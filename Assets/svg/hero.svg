<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffc8"/>
      <stop offset="1" stop-color="#00d4aa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00d4aa" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="16" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#00d4aa" stroke-width="0.5">
    <line x1="0" y1="44" x2="800" y2="44"/>
    <line x1="0" y1="88" x2="800" y2="88"/>
    <line x1="0" y1="132" x2="800" y2="132"/>
    <line x1="0" y1="176" x2="800" y2="176"/>
    <line x1="100" y1="0" x2="100" y2="220"/>
    <line x1="200" y1="0" x2="200" y2="220"/>
    <line x1="300" y1="0" x2="300" y2="220"/>
    <line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="500" y1="0" x2="500" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="700" y1="0" x2="700" y2="220"/>
  </g>

  <!-- Left: Logo + Title -->
  <!-- Lightning bolt logo -->
  <g transform="translate(52, 50)" filter="url(#soft)">
    <path d="M 38 0 L 12 42 L 26 42 L 18 80 L 44 36 L 30 36 Z"
          fill="url(#bolt)" stroke="#00ffc8" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="150" y="78" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="44" font-weight="800" fill="#f0f0f5" letter-spacing="-1">
    Bladebro
  </text>

  <!-- Tagline -->
  <text x="152" y="112" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="16" font-weight="500" fill="#00d4aa">
    Give your AI agent a browser. Few tools. Full control. Real stealth.
  </text>

  <!-- Feature roll-call -->
  <text x="152" y="138" font-family="'SF Mono', 'Cascadia Code', monospace"
        font-size="12" font-weight="400" fill="#8888a0">
    Re-render-immune refs · Batch actions · Auto-extract · 6-layer stealth · Delta-first
  </text>

  <!-- One-liner -->
  <text x="152" y="158" font-family="'SF Mono', 'Cascadia Code', monospace"
        font-size="12" font-weight="400" fill="#666680">
    One MCP server · one persistent page model · zero Node.js · one binary · Linux · macOS · Windows
  </text>

  <!-- Right: Browser window motif -->
  <g transform="translate(560, 40)">
    <!-- Browser window -->
    <rect x="0" y="0" width="200" height="140" rx="10" fill="#1a1a25" stroke="#2a2a3a" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="200" height="26" rx="10" fill="#22222e"/>
    <rect x="0" y="16" width="200" height="10" fill="#22222e"/>
    <!-- Traffic lights -->
    <circle cx="14" cy="13" r="4" fill="#ff5f57"/>
    <circle cx="28" cy="13" r="4" fill="#febc2e"/>
    <circle cx="42" cy="13" r="4" fill="#28c840"/>
    <!-- URL bar -->
    <rect x="58" y="7" width="130" height="12" rx="6" fill="#2a2a3a"/>

    <!-- Content: ref badges -->
    <rect x="12" y="36" width="40" height="14" rx="4" fill="#00d4aa" opacity="0.2"/>
    <text x="32" y="46" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00d4aa">e1</text>

    <rect x="60" y="36" width="40" height="14" rx="4" fill="#00d4aa" opacity="0.2"/>
    <text x="80" y="46" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00d4aa">e2</text>

    <rect x="108" y="36" width="40" height="14" rx="4" fill="#00d4aa" opacity="0.2"/>
    <text x="128" y="46" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00d4aa">e3</text>

    <!-- Delta line -->
    <rect x="12" y="60" width="170" height="2" rx="1" fill="#00d4aa" opacity="0.3"/>
    <rect x="12" y="60" width="80" height="2" rx="1" fill="#00d4aa" opacity="0.8"/>
    <text x="184" y="55" text-anchor="end" font-family="monospace" font-size="8" fill="#00d4aa">delta</text>

    <!-- Lines representing page content -->
    <rect x="12" y="74" width="160" height="3" rx="1.5" fill="#3a3a4a"/>
    <rect x="12" y="82" width="120" height="3" rx="1.5" fill="#3a3a4a"/>
    <rect x="12" y="90" width="140" height="3" rx="1.5" fill="#3a3a4a"/>

    <!-- Stealth shield -->
    <g transform="translate(150, 105)">
      <path d="M 16 0 L 0 6 L 0 18 Q 0 28 16 34 Q 32 28 32 18 L 32 6 Z"
            fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.6"/>
      <text x="16" y="22" text-anchor="middle" font-family="monospace" font-size="8" fill="#00d4aa" opacity="0.6">stealth</text>
    </g>

    <!-- Agent arrow -->
    <g transform="translate(30, 110)">
      <circle cx="0" cy="0" r="10" fill="#00d4aa" opacity="0.15"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00d4aa">AI</text>
    </g>

    <!-- Connection line agent → browser -->
    <line x1="42" y1="110" x2="140" y2="112" stroke="#00d4aa" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="216" width="800" height="4" rx="2" fill="url(#accent)"/>
</svg>
