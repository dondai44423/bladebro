<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffc8"/>
      <stop offset="1" stop-color="#00d4aa"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#00d4aa" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#00d4aa" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>

  <!-- Lightning bolt logo (centered) -->
  <g transform="translate(384, 24)" filter="url(#soft)">
    <path d="M 24 0 L 6 28 L 16 28 L 10 52 L 28 22 L 18 22 Z"
          fill="url(#bolt)" stroke="#00ffc8" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="400" y="108" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="40" font-weight="800" fill="#f0f0f5" letter-spacing="-1">
    Bladebro
  </text>

  <!-- Tagline -->
  <text x="400" y="134" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="500" fill="#00d4aa">
    Give your AI agent a browser. Few tools. Full control. Real stealth.
  </text>

  <!-- Feature roll-call -->
  <text x="400" y="158" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', monospace"
        font-size="11" font-weight="400" fill="#8888a0">
    Re-render-immune refs  ·  Batch actions  ·  Auto-extract  ·  6-layer stealth  ·  Delta-first
  </text>

  <!-- One-liner -->
  <text x="400" y="178" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', monospace"
        font-size="11" font-weight="400" fill="#666680">
    One MCP server  ·  zero Node.js  ·  one binary  ·  Linux  ·  macOS  ·  Windows
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="196" width="800" height="4" rx="2" fill="url(#accent)"/>
</svg>
