<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c4d0"/>
      <stop offset="0.5" stop-color="#e8f0f8"/>
      <stop offset="1" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00ffc8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00d4aa" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#00d4aa" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>

  <!-- Katana logo (left side, straight, vertical) -->
  <g transform="translate(45, 15)" filter="url(#glow)">
    <!-- Blade (pointing up, curved) -->
    <path d="M 28 0 Q 24 40 26 100 L 22 100 Q 22 40 24 0 Z"
          fill="url(#blade)" stroke="#00d4aa" stroke-width="0.6" stroke-linejoin="round"/>
    <!-- Cutting edge highlight -->
    <path d="M 26 100 L 28 0" fill="none" stroke="url(#edge)" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Hamon line (temper line) -->
    <path d="M 25 5 Q 23 50 24 95" fill="none" stroke="#00d4aa" stroke-width="0.4" opacity="0.3" stroke-dasharray="2,1.5"/>
    <!-- Kissaki (tip) -->
    <path d="M 26 0 L 28 0 L 27 -3 Z" fill="#e8f0f8" stroke="#00d4aa" stroke-width="0.6"/>

    <!-- Guard (tsuba) -->
    <rect x="14" y="100" width="24" height="6" rx="1.5" fill="#3a3a4a" stroke="#ff9f43" stroke-width="0.8" opacity="0.8"/>

    <!-- Handle (tsuka) -->
    <rect x="18" y="106" width="16" height="48" rx="2" fill="#1a1a25" stroke="#3a3a4a" stroke-width="1"/>
    <!-- Handle wrap lines (diamond pattern) -->
    <line x1="18" y1="112" x2="34" y2="118" stroke="#00d4aa" stroke-width="0.7" opacity="0.5"/>
    <line x1="18" y1="118" x2="34" y2="112" stroke="#00d4aa" stroke-width="0.7" opacity="0.5"/>
    <line x1="18" y1="124" x2="34" y2="130" stroke="#00d4aa" stroke-width="0.7" opacity="0.5"/>
    <line x1="18" y1="130" x2="34" y2="124" stroke="#00d4aa" stroke-width="0.7" opacity="0.5"/>
    <line x1="18" y1="136" x2="34" y2="142" stroke="#00d4aa" stroke-width="0.7" opacity="0.5"/>
    <line x1="18" y1="142" x2="34" y2="136" stroke="#00d4aa" stroke-width="0.7" opacity="0.5"/>

    <!-- Pommel (kashira) -->
    <circle cx="26" cy="157" r="4" fill="#2a2a3a" stroke="#00d4aa" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="160" y="72" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="38" font-weight="800" fill="#f0f0f5" letter-spacing="-1">
    Bladebro
  </text>

  <!-- Tagline -->
  <text x="162" y="96" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="14" font-weight="500" fill="#00d4aa">
    Give your AI agent a browser.
  </text>
  <text x="162" y="114" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="14" font-weight="500" fill="#00d4aa">
    Few tools. Full control. Real stealth.
  </text>

  <!-- Feature roll-call -->
  <text x="162" y="136" font-family="'SF Mono', 'Cascadia Code', monospace"
        font-size="10" font-weight="400" fill="#8888a0">
    Re-render-immune refs  ·  Batch actions  ·  Delta-first
  </text>

  <!-- One-liner -->
  <text x="162" y="154" font-family="'SF Mono', 'Cascadia Code', monospace"
        font-size="10" font-weight="400" fill="#666680">
    Zero Node.js  ·  one binary  ·  Linux  ·  macOS  ·  Windows
  </text>

  <!-- Terminal window motif (right side) -->
  <g transform="translate(500, 28)">
    <!-- Window frame -->
    <rect x="0" y="0" width="270" height="150" rx="8" fill="#1a1a25" stroke="#2a2a3a" stroke-width="1.5"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="270" height="24" rx="8" fill="#22222e"/>
    <rect x="0" y="14" width="270" height="10" fill="#22222e"/>
    <!-- Traffic lights -->
    <circle cx="13" cy="12" r="3.5" fill="#ff5f57"/>
    <circle cx="25" cy="12" r="3.5" fill="#febc2e"/>
    <circle cx="37" cy="12" r="3.5" fill="#28c840"/>
    <!-- URL bar -->
    <rect x="52" y="7" width="200" height="10" rx="5" fill="#2a2a3a"/>

    <!-- Ref badges -->
    <rect x="12" y="34" width="38" height="14" rx="4" fill="#00d4aa" opacity="0.2"/>
    <text x="31" y="44" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00d4aa">e1</text>

    <rect x="56" y="34" width="38" height="14" rx="4" fill="#00d4aa" opacity="0.2"/>
    <text x="75" y="44" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00d4aa">e2</text>

    <rect x="100" y="34" width="38" height="14" rx="4" fill="#00d4aa" opacity="0.2"/>
    <text x="119" y="44" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00d4aa">e3</text>

    <!-- Delta indicator -->
    <rect x="12" y="56" width="230" height="2" rx="1" fill="#00d4aa" opacity="0.2"/>
    <rect x="12" y="56" width="110" height="2" rx="1" fill="#00d4aa" opacity="0.7"/>
    <text x="242" y="52" text-anchor="end" font-family="monospace" font-size="8" fill="#00d4aa">delta</text>

    <!-- Page content lines -->
    <rect x="12" y="70" width="220" height="3" rx="1.5" fill="#3a3a4a"/>
    <rect x="12" y="78" width="170" height="3" rx="1.5" fill="#3a3a4a"/>
    <rect x="12" y="86" width="190" height="3" rx="1.5" fill="#3a3a4a"/>

    <!-- Stealth shield (bottom right) -->
    <g transform="translate(210, 105)">
      <path d="M 16 0 L 0 6 L 0 18 Q 0 28 16 34 Q 32 28 32 18 L 32 6 Z"
            fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.5"/>
      <text x="16" y="22" text-anchor="middle" font-family="monospace" font-size="8" fill="#00d4aa" opacity="0.5">stealth</text>
    </g>

    <!-- Agent node (bottom left) -->
    <g transform="translate(30, 112)">
      <circle cx="0" cy="0" r="11" fill="#00d4aa" fill-opacity="0.12" stroke="#00d4aa" stroke-width="0.8" opacity="0.4"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00d4aa">AI</text>
    </g>

    <!-- Connection line -->
    <line x1="42" y1="112" x2="195" y2="115" stroke="#00d4aa" stroke-width="1" stroke-dasharray="3,3" opacity="0.25"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="196" width="800" height="4" rx="2" fill="url(#accent)"/>
</svg>
