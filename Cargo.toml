[package]
name = "bladebro"
version = "4.6.8"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
description = "An agentic browser driver for AI — few tools, full control, real stealth, god-tier token efficiency."
repository = "https://github.com/dondai44423/bladebro"

[lib]
name = "bladebro"
path = "src/lib.rs"

[[bin]]
name = "bladebro"
path = "src/main.rs"

[[test]]
name = "hermes_cli"
harness = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util", "io-std", "signal", "process"] }
# CDP transport — plain ws:// to localhost; no TLS feature needed (avoids any OpenSSL)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP discovery of CDP targets (rustls — no system OpenSSL, portable binary)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Errors + logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# Decode Page.printToPDF output (base64) into PDF bytes for the artifact file.
# Compile-time only, no transitive deps.
base64 = "0.23"
# SHA256 verification of downloaded update binaries against the release's
# checksum file. SECURITY: fail-closed for releases >= 3.3.0 — a missing or
# mismatched checksum aborts the update (catches MITM/corruption/wrong
# asset; full account compromise requires release signing, see the audit
# report's recommendation).
sha2 = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# The gate profile: what `cargo test`, CI and release.sh compile the suite
# with. Release codegen (opt-level 3, no debug info, stripped) without LTO.
# Thin LTO + codegen-units=1 is worth it only for the shipped artifact
# (measured 2026-11-13, i5-1145G7: 8.2 MB vs 11.9 MB binary, 4.8 vs 4.9 ms
# startup) and it makes every one of the 21 test binaries re-run the LTO
# pass — edit → all test binaries: 420 s at release vs 27 s here. The shipped
# artifacts still build with `cargo build --release`.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
# Keep symbols in test binaries: a failing gate should name its frames, and
# skipping the strip step is also marginally faster than doing it.
strip = "none"
