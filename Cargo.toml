[package]
name = "bladebro"
version = "3.0.11"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "An agentic browser driver for AI — few tools, full control, real stealth, god-tier token efficiency."
repository = "https://github.com/dondai44423/bladebro"

[lib]
name = "bladebro"
path = "src/lib.rs"

[[bin]]
name = "bladebro"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util", "io-std", "signal"] }
# CDP transport — plain ws:// to localhost; no TLS feature needed (avoids any OpenSSL)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP discovery of CDP targets (rustls — no system OpenSSL, portable binary)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Errors + logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# Decode Page.printToPDF output (base64) into PDF bytes for the artifact file.
# Compile-time only, no transitive deps.
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
